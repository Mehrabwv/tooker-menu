name: Update menu and website

on:
  schedule:
    # Arizona is UTC-7 all year: these run at about 5:23 AM and 2:23 PM Arizona time.
    - cron: '23 12 * * *'
    - cron: '23 21 * * *'
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]      # redeploy whenever you push changes to the site

permissions:
  contents: write   # commit the new menu.json
  pages: write      # publish to GitHub Pages
  id-token: write   # required by the Pages deploy action

concurrency:
  group: update-menu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Scrape the next 7 days
        id: scrape
        continue-on-error: true   # if the dining site is down, keep the last good menu
        run: node scraper.js --days 7 --all-stations --json docs/menu.json

      - name: Commit the new menu
        if: steps.scrape.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/menu.json
          if git diff --cached --quiet; then echo "Menu unchanged"; exit 0; fi
          git commit -m "Update menu $(TZ=America/Phoenix date +'%Y-%m-%d %H:%M')"
          git push || (git pull --rebase origin main && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
